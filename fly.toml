# fly.toml app configuration file generated for namegen-diegouqz on 2026-10-31T19:05:58Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'namegen-diegouqz'
primary_region = 'ams'

[build]

[env]
  NAMEGEN_BASE_URL = 'https://namegen-diegouqz.fly.dev'
  NAMEGEN_NETWORK = 'base'
  NAMEGEN_FACILITATOR_URL = 'https://facilitator.payai.network'
  NAMEGEN_MIN_PRICE_USDC = '0.10'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
